openapi: 3.1.0
info: {title: results over MCP, version: "1"}
paths:
  /pets/count:
    get:
      operationId: countPets
      summary: Count the pets
      responses:
        "200":
          description: how many pets there are
          content:
            application/json: {schema: {type: integer}}
  /pets/find:
    get:
      operationId: findPet
      summary: Find a pet by name
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: the pet
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
        "204":
          description: no pet has that name
  /pets/photo:
    get:
      operationId: getPhoto
      summary: The photo or the voice of a pet, in whatever format it was stored
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: the stored file
          content:
            "*/*": {schema: {type: string, format: binary}}
  /pets/icon:
    get:
      operationId: getIcon
      summary: The icon of the pet store
      responses:
        "200":
          description: a PNG
          content:
            image/png: {}
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string}

openapi: 3.1.0
info: {title: results over MCP, version: "1"}
paths:
  /pets/count:
    get:
      operationId: countPets
      summary: Count the pets
      responses:
        "200":
          description: how many pets there are
          content:
            application/json: {schema: {type: integer}}
  /pets/find:
    get:
      operationId: findPet
      summary: Find a pet by name
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: the pet
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
        "204":
          description: no pet has that name
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string}

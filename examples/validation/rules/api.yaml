openapi: 3.1.0
info: {title: validation rules, version: "1"}
paths: {}
components:
  schemas:
    Code:
      type: string
      pattern: '^[A-Z]{3}$'
    Size: {type: string, enum: [s, m, l]}
    Item:
      type: object
      required: [name, code, tags]
      properties:
        name: {type: string, minLength: 2, maxLength: 10}
        code: {$ref: '#/components/schemas/Code'}
        id: {type: string, format: uuid}
        site: {type: string, format: uri}
        host: {type: string, format: hostname}
        email: {type: string, format: email}
        price: {type: number, minimum: 0, exclusiveMaximum: 1000, multipleOf: 0.01}
        count: {type: integer, exclusiveMinimum: 0, maximum: 5}
        tags: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: string, maxLength: 5}}
        labels: {type: object, maxProperties: 2, additionalProperties: {type: string, minLength: 1}}
        kind: {type: string, const: item}
        size: {$ref: '#/components/schemas/Size'}

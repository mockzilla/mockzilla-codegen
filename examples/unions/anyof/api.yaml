openapi: 3.1.0
info: {title: anyOf, version: "1"}
paths: {}
components:
  schemas:
    Named:
      type: object
      required: [name]
      properties:
        name: {type: string}
    Aged:
      type: object
      required: [age]
      properties:
        age: {type: integer}
    Person:
      anyOf:
        - $ref: '#/components/schemas/Named'
        - $ref: '#/components/schemas/Aged'
    Stamp:
      anyOf:
        - {type: string, format: date-time}
        - {type: string}
        - {type: 'null'}

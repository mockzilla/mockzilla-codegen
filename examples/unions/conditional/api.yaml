openapi: 3.1.0
info: {title: if then else, version: "1"}
paths: {}
components:
  schemas:
    Shipping:
      description: Then applies when kind is post, else for anything else.
      type: object
      required: [kind]
      properties:
        kind: {type: string}
      if:
        properties:
          kind: {const: post}
      then:
        properties:
          address: {type: string}
      else:
        properties:
          store: {type: string}
    Discount:
      description: A single branch adds its properties as optional fields.
      type: object
      properties:
        percent: {type: integer}
      if:
        properties:
          percent: {const: 100}
      then:
        required: [reason]
        properties:
          reason: {type: string}
    Endpoint:
      description: Then applies when secure is true or left out, else when it is false.
      type: object
      properties:
        secure: {type: boolean}
      if:
        properties:
          secure: {const: true}
      then:
        properties:
          cert: {type: string}
      else:
        properties:
          port: {type: integer}
    Retry:
      description: Then applies when attempts is 3; the if requires attempts, so without it else applies.
      type: object
      properties:
        attempts: {type: integer}
      if:
        required: [attempts]
        properties:
          attempts: {const: 3}
      then:
        properties:
          backoff: {type: string}
      else:
        properties:
          delay: {type: integer}

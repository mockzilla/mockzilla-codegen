openapi: 3.1.0
info: {title: discriminators, version: "1"}
paths: {}
components:
  schemas:
    Card:
      type: object
      required: [type, number]
      properties:
        type: {type: string}
        number: {type: string}
    Bank:
      type: object
      required: [type, iban]
      properties:
        type: {type: string}
        iban: {type: string}
    Wallet:
      type: object
      required: [type]
      properties:
        type: {type: string, const: wallet}
        provider: {type: string}
    Unknown:
      type: object
      properties:
        type: {type: string}
    Payment:
      description: Explicit mapping for card, the implicit component name for Bank, a const for Wallet.
      oneOf:
        - $ref: '#/components/schemas/Card'
        - $ref: '#/components/schemas/Bank'
        - $ref: '#/components/schemas/Wallet'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/Card'
          credit_card: '#/components/schemas/Card'
    Tolerant:
      description: Any other type value falls back to Unknown.
      oneOf:
        - $ref: '#/components/schemas/Card'
        - $ref: '#/components/schemas/Unknown'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/Card'
        defaultMapping: '#/components/schemas/Unknown'
    Inline:
      oneOf:
        - type: object
          properties:
            kind: {const: circle}
            radius: {type: number}
        - type: object
          properties:
            kind: {const: square}
            side: {type: number}
      discriminator: {propertyName: kind}
    Web:
      type: object
      properties:
        host: {type: string}
    Shell:
      type: object
      properties:
        key: {type: string}
    Server:
      description: Two values pick Web, which has no server_type, so the union keeps the value.
      oneOf:
        - $ref: '#/components/schemas/Web'
        - $ref: '#/components/schemas/Shell'
      discriminator:
        propertyName: server_type
        mapping:
          nginx: '#/components/schemas/Web'
          apache: '#/components/schemas/Web'
          shell: '#/components/schemas/Shell'
    Secure:
      type: object
      properties:
        is_secure: {type: boolean, enum: [true]}
        cert: {type: string}
    Plain:
      type: object
      properties:
        is_secure: {type: boolean, enum: [false]}
        port: {type: integer}
    Connection:
      description: A boolean property is no discriminator, so the enums pick the variant.
      oneOf:
        - $ref: '#/components/schemas/Secure'
        - $ref: '#/components/schemas/Plain'
      discriminator:
        propertyName: is_secure
        mapping:
          "true": '#/components/schemas/Secure'
          "false": '#/components/schemas/Plain'

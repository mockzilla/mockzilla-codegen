# The oapi-codegen-dd config this example starts from. codegen.yaml next to it is its translation.
# yaml-language-server: $schema=https://raw.githubusercontent.com/doordash-oss/oapi-codegen-dd/HEAD/configuration-schema.json
package: petstore
copyright-header: "Copyright 2026 Acme. Code generated by oapi-codegen. DO NOT EDIT."
output:
  use-single-file: true
  filename: gen.go
generate:
  default-int-type: int64
  additional-tags: [yaml]
  validation:
    response: true
  handler:
    kind: chi
    name: Pets
    multipart-max-memory: 64
    validation:
      request: true
  client: true
  client-with-response: true
  mcp-server: {}
client:
  name: PetClient
  timeout: 5s
filter:
  exclude:
    tags: [admin]
error-mapping:
  Error: message

# yaml-language-server: $schema=../../../config.schema.json
# Translation of cfg.yaml, see docs/migration/oapi-codegen-dd.md.
spec:
  path: api.yaml                # the spec argument of the oapi-codegen command
  filter:
    exclude: {tags: [admin]}    # filter, unchanged
package: petstore
header: "Copyright 2026 Acme. Code generated by mockzilla-codegen. DO NOT EDIT."  # copyright-header
models:
  int-type: int64               # generate.default-int-type
  extra-tags: [yaml]            # generate.additional-tags
  validation: {response: true}  # generate.validation.response
  error-mapping: {Error: message}  # error-mapping
server:
  framework: chi                # generate.handler.kind
  name: Pets                    # generate.handler.name
  multipart-max-memory: 64MB    # generate.handler.multipart-max-memory, with a unit
  validation: {request: true}   # generate.handler.validation.request
client:
  name: PetClient               # client.name
  timeout: 5s                   # client.timeout
  with-response: true           # generate.client-with-response
mcp: {}                         # generate.mcp-server
output:
  file: ./gen.go                # output.filename, with output.use-single-file

openapi: 3.1.0
info: {title: Enums, version: "1.0"}
paths: {}
components:
  schemas:
    Status:
      type: string
      description: Where an order is.
      enum: [placed, in_transit, delivered]
    Priority:
      type: integer
      enum: [1, 2, 3]
    Ratio:
      type: number
      format: float
      enum: [0.5, 1.5]
    Order:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/Status'}
        priority: {$ref: '#/components/schemas/Priority'}
        channel:
          type: string
          enum: [web, phone]

openapi: 3.2.0
info: {title: parameter styles, version: "1"}
paths:
  /path/{simple}/{label}/{matrix}/{list}:
    get:
      operationId: pathStyles
      parameters:
        - {name: simple, in: path, required: true, schema: {type: string}}
        - {name: label, in: path, required: true, style: label, schema: {type: integer}}
        - {name: matrix, in: path, required: true, style: matrix, schema: {type: boolean}}
        - {name: list, in: path, required: true, explode: true, schema: {type: array, items: {type: string}}}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
  /query:
    get:
      operationId: queryStyles
      parameters:
        - {name: form, in: query, schema: {type: array, items: {type: integer}}}
        - {name: csv, in: query, explode: false, schema: {type: array, items: {type: string}}}
        - {name: space, in: query, style: spaceDelimited, explode: false, schema: {type: array, items: {type: string}}}
        - {name: pipe, in: query, style: pipeDelimited, explode: false, schema: {type: array, items: {type: string}}}
        - {name: deep, in: query, style: deepObject, schema: {$ref: '#/components/schemas/Point'}}
        - {name: flat, in: query, explode: false, schema: {$ref: '#/components/schemas/Point'}}
        - {name: json, in: query, content: {application/json: {schema: {$ref: '#/components/schemas/Point'}}}}
        - {name: filter, in: query, style: deepObject, schema: {$ref: '#/components/schemas/Filter'}}
        - name: queries
          in: query
          schema: {type: object, properties: {reference: {type: string}, status: {type: array, items: {type: string}}}}
        - {name: id, in: query, schema: {oneOf: [{type: integer}, {type: string}]}}
        - {name: created, in: query, style: deepObject, schema: {anyOf: [{$ref: '#/components/schemas/Range'}, {type: integer}]}}
        - {name: ids, in: query, allowReserved: true, schema: {type: string}}
        - {name: needed, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
  /header:
    get:
      operationId: headerStyles
      parameters:
        - {name: X-Tags, in: header, schema: {type: array, items: {type: string}}}
        - {name: X-Point, in: header, schema: {$ref: '#/components/schemas/Point'}}
        - {name: X-When, in: header, schema: {type: string, format: date-time}}
        - {name: X-Limit, in: header, schema: {anyOf: [{type: integer}, {type: boolean}]}}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
  /cookie:
    get:
      operationId: cookieStyles
      parameters:
        - {name: session, in: cookie, schema: {type: string}}
        - {name: flags, in: cookie, explode: false, schema: {type: array, items: {type: integer}}}
        - {name: prefs, in: cookie, style: cookie, explode: false, schema: {type: array, items: {type: string}}}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
  /search:
    get:
      operationId: search
      parameters:
        - name: filter
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema: {$ref: '#/components/schemas/Filter'}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
    post:
      operationId: find
      parameters:
        - name: q
          in: querystring
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Filter'}
      responses:
        "200":
          description: echo
          content:
            application/json: {schema: {$ref: '#/components/schemas/Echo'}}
components:
  schemas:
    Range:
      type: object
      properties:
        gte: {type: integer}
        lt: {type: integer}
    Point:
      type: object
      properties:
        x: {type: integer}
        y: {type: integer}
    Filter:
      type: object
      properties:
        name: {type: string}
        tags: {type: array, items: {type: string}}
        size: {$ref: '#/components/schemas/Point'}
    Echo:
      type: object
      additionalProperties: true

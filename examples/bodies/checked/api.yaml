openapi: 3.1.0
info: {title: checked bodies, version: "1"}
paths:
  /pets:
    post:
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Pet'}}
          application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/Pet'}}
      responses:
        "200":
          description: the pet as the service got it
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
  /uploads:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data: {schema: {$ref: '#/components/schemas/Upload'}}
      responses:
        "200":
          description: the note and the file name
          content:
            text/plain: {schema: {type: string}}
components:
  schemas:
    Pet:
      type: object
      additionalProperties: false
      required: [name, owner]
      properties:
        name: {type: string}
        tag: {type: [string, "null"]}
        age: {type: integer, default: 1}
        size: {type: [string, "null"], default: m}
        owner: {$ref: '#/components/schemas/Owner'}
        tags: {type: array, items: {type: string}}
        toys:
          type: array
          items: {$ref: '#/components/schemas/Toy'}
    Owner:
      type: object
      required: [id]
      properties:
        id: {type: integer}
        city: {type: string, default: Berlin}
    Toy:
      type: object
      required: [name]
      properties:
        name: {type: string}
        color: {type: string, default: red}
    Upload:
      type: object
      required: [photo]
      properties:
        photo: {type: string, format: binary}
        note: {type: string, default: none}

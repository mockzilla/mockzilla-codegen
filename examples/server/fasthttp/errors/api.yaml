openapi: 3.1.0
info: {title: errors, version: "1"}
paths:
  /pets/{id}:
    get:
      operationId: getPet
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: fields, in: query, schema: {type: array, items: {type: string, enum: [name, age]}}}
      responses:
        "200":
          description: ok
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
        "404":
          description: no such pet
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
        "409":
          description: locked
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/Locked'}}
    put:
      operationId: putPet
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Pet'}}
      responses:
        "200":
          description: ok
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        age: {type: integer, minimum: 0, readOnly: true}
    Problem:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    Locked:
      type: object
      properties:
        detail: {type: string}
        until: {type: string}

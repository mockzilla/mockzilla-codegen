version: "2"

run:
  timeout: 5m
  build-tags:
    - parse
    - integration

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - goheader
    - gosec
    - misspell
    - nolintlint
    - revive
    - testifylint
    - unconvert
    - unparam
    - wastedassign
  settings:
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true
    gocritic:
      enabled-checks:
        - importShadow
        - builtinShadowDecl
    goheader:
      values:
        regexp:
          copyright-year: 20[0-9]{2}
      template: |-
        Copyright (c) {{ copyright-year }} Mockzilla
        SPDX-License-Identifier: MIT
        Licensed under the MIT License, see LICENSE in the repository root. This copyright notice and
        permission notice shall be included in all copies or substantial portions of the Software.
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: library code returns errors and diagnostics; only cmd/ prints
    gosec:
      # A code generator reads user-given paths (G304) and writes source folders as 0755 (G301)
      # and files as 0644 (G306).
      excludes:
        - G301
        - G304
        - G306
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: import-shadowing
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    paths:
      - examples
      - testdata
    rules:
      - path: ^(cmd|scripts)/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
      # The integration harness runs go and the generated binaries by design.
      - path: ^internal/itest/
        linters:
          - gosec
        text: "^G204:"
      # maxMemory bounds what stays in memory; the size of the body is the server's job, as with
      # every other decoder here.
      - path: ^pkg/runtime/(body|presence)\.go
        linters:
          - gosec
        text: "^G120:"
      # These are request cookies written by the client; Secure, HttpOnly and SameSite only exist on
      # Set-Cookie.
      - path: ^pkg/runtime/params\.go
        linters:
          - gosec
        text: "^G124:"
      # Generated code imports it as runtime, like other OpenAPI generators do.
      - path: ^pkg/runtime/
        linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library package names"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mockzilla/mockzilla-codegen
  exclusions:
    generated: strict
    paths:
      - examples
      - testdata

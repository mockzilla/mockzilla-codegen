openapi: 3.0.3
info: {title: t, version: '1'}
paths:
  /a:
    get:
      responses:
        default: {description: error}
        '404': {$ref: '#/components/responses/NotFound'}
        5XX: {description: server}
        '200':
          description: ok
          headers:
            X-Rate: {description: rate, required: true, deprecated: true, style: simple, explode: true, schema: {type: integer}}
            X-Limit: {$ref: '#/components/headers/Limit'}
            X-Json: {content: {application/json: {schema: {type: object}}}}
          content: {application/json: {schema: {type: string}}}
          x-cache: true
        2XX: {description: range}
        '201': {description: created}
        weird: {description: not a status}
  /b:
    get:
      responses:
        '200': {$ref: '#/paths/~1a/get/responses/200'}
components:
  headers:
    Limit: {schema: {type: integer}}
  responses:
    NotFound:
      description: missing
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Created: {$ref: '#/paths/~1a/get/responses/201'}
  schemas:
    Error: {type: object}

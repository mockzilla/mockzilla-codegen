openapi: 3.0.3
info: {title: t, version: '1'}
paths:
  /items/{id}:
    get:
      parameters:
        - {name: id, in: path, schema: {type: integer}}
        - {name: q, in: query, description: Search, deprecated: true, allowEmptyValue: true, allowReserved: true, schema: {type: string}}
        - {name: tags, in: query, style: pipeDelimited, explode: false, schema: {type: array, items: {type: string}}}
        - {name: X-Id, in: header, schema: {type: string}}
        - {name: session, in: cookie, explode: false, schema: {type: string}}
        - {name: filter, in: query, content: {application/json: {schema: {type: object}}}}
        - {name: page, in: query, x-paging: true, schema: {type: integer}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Alias'
        - $ref: '#/paths/~1later/get/parameters/0'
      responses: {'200': {description: ok}}
  /later:
    get:
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: theme, in: cookie, style: cookie, schema: {type: array, items: {type: string}}}
      responses: {'200': {description: ok}}
components:
  parameters:
    Limit: {name: limit, in: query, required: true, schema: {type: integer, maximum: 100}}
    Alias: {$ref: '#/components/parameters/Limit'}

webhooks: {}
components:
  parameters:
    Bogus: {name: bogus, in: body, schema: {type: string}}
  schemas:
    Kinds:
      type: object
      properties:
        interval: string
        list: [a]
        flag: true
        minLength: {type: string, minLength: abc}
        fraction: {type: string, minLength: 1.5, maxLength: -1}
        typed: {type: {a: b}}

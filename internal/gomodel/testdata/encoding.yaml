openapi: 3.1.0
info: {title: encoding, version: v1}
paths:
  /parcels:
    post:
      operationId: sendParcel
      requestBody:
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/Parcel'}
            encoding:
              id: {contentType: application/json}
              doc: {contentType: application/pdf}
              logo: {contentType: 'image/png, image/jpeg'}
              pet: {contentType: application/xml}
              pets: {contentType: 'text/plain, application/*'}
              labels: {contentType: 'text/csv, application/vnd.a+json'}
              meta: {contentType: text/plain}
              note: {contentType: text/plain, style: form}
              tags: {explode: true}
              flags: {allowReserved: true}
              ghost: {contentType: application/json}
              signed:
                contentType: application/pdf
                headers:
                  X-Sign: {schema: {type: string}}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Parcel'}
            encoding:
              pet: {contentType: application/json}
              pets: {style: deepObject, explode: true}
              signed:
                headers:
                  X-Sign: {schema: {type: string}}
          application/json:
            schema: {$ref: '#/components/schemas/Parcel'}
            encoding:
              pet: {contentType: application/json}
      responses:
        '200':
          description: ok
          content:
            multipart/form-data:
              schema: {$ref: '#/components/schemas/Parcel'}
              encoding:
                id: {contentType: application/json}
  /unions:
    post:
      operationId: sendUnion
      requestBody:
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Parcel'
                - {type: object, required: [x], properties: {x: {type: string}}}
            encoding:
              id: {contentType: application/json}
          application/x-www-form-urlencoded:
            schema: {type: object, additionalProperties: {type: string}}
            encoding:
              id: {contentType: application/json}
      responses:
        '204': {description: done}
  /styled:
    post:
      operationId: sendStyled
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Parcel'}
            encoding:
              pets: {style: deepObject, explode: true, contentType: application/json}
      responses:
        '204': {description: done}
  /ghosts:
    post:
      operationId: sendGhost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Parcel'}
            encoding:
              ghost: {contentType: application/json}
      responses:
        '204': {description: done}
  /styles:
    post:
      operationId: sendStyles
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Styles'}
            encoding:
              matrixList: {style: matrix}
              spaceWord: {style: spaceDelimited}
              pipeList: {style: pipeDelimited, explode: true}
              formNested: {style: form, explode: false}
              formUnion: {style: form}
              deepUnion: {style: deepObject}
              deepWord: {style: deepObject}
              deepPet: {style: deepObject}
              csv: {style: form, explode: false}
              path: {allowReserved: true}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/Styles'}
            encoding:
              file: {style: deepObject}
              deepPet: {style: deepObject, explode: true}
      responses:
        '204': {description: done}
components:
  schemas:
    Styles:
      type: object
      properties:
        matrixList: {type: array, items: {type: string}}
        spaceWord: {type: string}
        pipeList: {type: array, items: {type: string}}
        formNested: {type: object, properties: {tags: {type: array, items: {type: string}}}}
        formUnion: {oneOf: [{$ref: '#/components/schemas/Pet'}, {type: object, required: [kind], properties: {kind: {type: string}}}]}
        deepUnion: {anyOf: [{type: object, properties: {tags: {type: array, items: {type: string}}}}, {type: string, enum: ['']}]}
        deepWord: {type: string}
        deepPet: {$ref: '#/components/schemas/Pet'}
        csv: {type: array, items: {type: string}}
        path: {type: string}
        file: {type: string, format: binary}
    Parcel:
      type: object
      required: [id]
      properties:
        id: {type: string}
        doc: {type: string, format: binary}
        logo: {type: string, format: binary}
        pet: {$ref: '#/components/schemas/Pet'}
        pets: {type: array, items: {$ref: '#/components/schemas/Pet'}}
        labels: {type: array, items: {$ref: '#/components/schemas/Pet'}}
        meta: {type: object, additionalProperties: {type: string}}
        note: {type: string}
        tags: {type: array, items: {type: string}}
        flags: {type: string}
        signed: {type: string, format: binary}
    Pet:
      type: object
      properties:
        name: {type: string}

openapi: 3.1.0
info: {title: unions, version: "1"}
paths: {}
components:
  schemas:
    Cat:
      type: object
      required: [kind, meow]
      properties:
        kind: {type: string, const: cat}
        meow: {type: boolean}
    Dog:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [dog]}
        bark: {type: boolean}
      additionalProperties: false
    Fish:
      type: object
      properties:
        kind: {type: string}
        fins: {type: integer}
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Fish'
      discriminator:
        propertyName: kind
        mapping:
          kitty: '#/components/schemas/Cat'
          cat: '#/components/schemas/Cat'
    WithDefault:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Fish'
      discriminator:
        propertyName: kind
        defaultMapping: '#/components/schemas/Fish'
    NullableRef:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - type: 'null'
    NullableInline:
      anyOf:
        - {type: string, format: date-time}
        - {type: 'null'}
    Primitives:
      oneOf:
        - {type: string}
        - {type: integer, format: int64}
        - {type: number}
        - {type: boolean}
        - {type: array, items: {type: string}}
        - {type: string, format: date}
        - {type: string, format: byte}
        - {type: object, additionalProperties: {type: string}}
        - {type: 'null'}
    Duplicates:
      oneOf:
        - {type: string, maxLength: 3}
        - {type: string, pattern: '^a'}
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Cat'
    Inline:
      anyOf:
        - title: Card
          type: object
          properties: {number: {type: string}}
        - type: object
          properties: {iban: {type: string}}
        - type: string
          enum: [cash, check]
    InlineDisc:
      oneOf:
        - type: object
          properties: {type: {const: card}, number: {type: string}}
        - type: object
          properties: {type: {const: 2fa}, code: {type: string}}
      discriminator: {propertyName: type}
    WithShared:
      type: object
      required: [id]
      properties:
        id: {type: string}
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    AllOfUnion:
      allOf:
        - $ref: '#/components/schemas/Fish'
        - oneOf:
            - {type: object, properties: {a: {type: string}}}
            - {type: object, properties: {b: {type: string}}}
    TypeList:
      type: [string, integer, object, array, 'null']
      format: int32
      properties: {x: {type: string}}
      items: {type: integer}
      enum: [a, b, 1, 2.5]
    IfThenElse:
      type: object
      properties: {kind: {type: string}}
      if: {properties: {kind: {const: a}}}
      then: {properties: {a: {type: string}}}
      else: {$ref: '#/components/schemas/Fish'}
    IfThenElseByShape:
      if: {required: [a]}
      then: {type: object, properties: {a: {type: string}}}
      else: {type: object, properties: {b: {type: string}}}
    IfThen:
      type: object
      required: [kind]
      properties: {kind: {type: string}}
      if: {properties: {kind: {const: a}}}
      then: {required: [a], properties: {a: {type: string}}}
    Nested:
      oneOf:
        - $ref: '#/components/schemas/Pet'
        - oneOf:
            - {type: string}
            - {type: integer}
    Holder:
      type: object
      required: [pet, maybe]
      properties:
        list: {type: array, items: {oneOf: [{type: string}, {type: integer}]}}
        map: {type: object, additionalProperties: {anyOf: [{type: string}, {type: boolean}]}}
        pet: {$ref: '#/components/schemas/Pet'}
        maybe: {oneOf: [{$ref: '#/components/schemas/Dog'}, {type: 'null'}]}
        text: {anyOf: [{type: string}, {type: 'null'}]}
    OnlyNull:
      oneOf: [{type: 'null'}]
    Anything:
      oneOf: [{}, {type: string, format: json}, {type: string}]
    Self:
      oneOf:
        - $ref: '#/components/schemas/Self'
        - {type: string}
        - {type: integer}
    NoIf:
      then: {type: object, properties: {a: {type: string}}}
      else: {type: object, properties: {b: {type: string}}}
    IfWithoutConst:
      if: {properties: {kind: {type: string}}}
      then: {type: object, properties: {a: {type: string}}}
      else: {type: object, properties: {b: {type: string}}}
    IfThenElseAllOf:
      allOf:
        - $ref: '#/components/schemas/Fish'
      if: {properties: {kind: {const: a}}}
      then: {type: object, properties: {a: {type: string}}}
      else: {type: object, properties: {b: {type: string}}}
    Bird:
      type: object
      properties:
        wings: {type: integer}
    Flyer:
      oneOf:
        - $ref: '#/components/schemas/Bird'
        - $ref: '#/components/schemas/Cat'
      discriminator: {propertyName: kind}
    Vehicle:
      type: object
      required: [kind]
      properties: {kind: {type: string}}
      discriminator: {propertyName: kind}
      oneOf:
        - $ref: '#/components/schemas/Car'
        - $ref: '#/components/schemas/Bike'
    Car:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties: {doors: {type: integer}}
    Bike:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties: {gears: {type: integer}}
    Only:
      oneOf: [{$ref: '#/components/schemas/OnlyChild'}]
    OnlyChild:
      allOf:
        - $ref: '#/components/schemas/Only'
        - {type: object, properties: {x: {type: string}}}
    Flag:
      type: [boolean, string]
    SameRequired:
      oneOf:
        - {type: object, required: [id], properties: {id: {type: string}, a: {type: string}}}
        - {type: object, required: [id], properties: {id: {type: string}, b: {type: string}}}
        - {type: object, required: [id, c], properties: {id: {type: string}, c: {type: string}}}
    Sum:
      oneOf:
        - $ref: '#/components/schemas/Sum1'
        - $ref: '#/components/schemas/Sum2'
    Sum1:
      oneOf:
        - {type: object, required: [common, one], properties: {common: {type: string}, one: {type: string}}}
        - {type: object, required: [common, two], properties: {common: {type: string}, two: {type: string}}}
    Sum2:
      oneOf:
        - {type: object, required: [common, three], properties: {common: {type: string}, three: {type: string}}}
        - {type: string}
    SumClash:
      oneOf:
        - $ref: '#/components/schemas/Sum1'
        - $ref: '#/components/schemas/SumAgain'
    SumAgain:
      oneOf:
        - {type: object, required: [common, one], properties: {common: {type: string}, one: {type: string}, x: {type: string}}}
        - {type: integer}
    Outer:
      oneOf:
        - $ref: '#/components/schemas/Inner'
        - $ref: '#/components/schemas/Flyer'
        - $ref: '#/components/schemas/Loose'
        - {type: object, required: [z], properties: {z: {type: string}}}
    Inner:
      type: object
      required: [note]
      properties: {note: {type: string}}
      oneOf:
        - {type: object, required: [x], properties: {x: {type: string}}}
        - $ref: '#/components/schemas/InnerLoop'
    InnerLoop:
      oneOf:
        - $ref: '#/components/schemas/Inner'
        - {type: object, required: [y], properties: {y: {type: string}}}
    Loose:
      oneOf:
        - {type: object, additionalProperties: {type: string}}
        - {type: boolean}
    Dup:
      oneOf:
        - $ref: '#/components/schemas/Twin'
        - {type: object, required: [w], properties: {w: {type: string}}}
    Twin:
      oneOf:
        - {type: object, required: [id], properties: {id: {type: string}, a: {type: string}}}
        - {type: object, required: [id], properties: {id: {type: string}, b: {type: string}}}
    TwoOneOfs:
      allOf:
        - oneOf:
            - {type: object, required: [a], properties: {a: {type: string}}}
            - {type: object, required: [b], properties: {b: {type: integer}}}
        - oneOf:
            - {type: object, required: [c], properties: {c: {type: string}}, additionalProperties: false}
            - {type: object, properties: {d: {type: integer}}}
            - {type: object, properties: {e: {type: integer}}}
    OneAndAny:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      anyOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Bird'
      discriminator: {propertyName: kind}
    OneAndIf:
      oneOf:
        - {type: object, required: [a], properties: {a: {type: string}}}
        - {type: object, required: [b], properties: {b: {type: string}}}
      if: {properties: {kind: {const: x}}}
      then: {type: object, properties: {x: {type: string}}}
      else: {type: object, properties: {y: {type: string}}}
    IfWithNull:
      oneOf:
        - {type: object, required: [a], properties: {a: {type: string}}}
        - {type: object, required: [b], properties: {b: {type: string}}}
      if: {properties: {kind: {const: x}}}
      then: {type: 'null'}
      else: {type: object, properties: {y: {type: string}}}
    TwoRefs:
      allOf:
        - $ref: '#/components/schemas/WithShared'
        - $ref: '#/components/schemas/Flyer'
    HoldsTwo:
      oneOf:
        - $ref: '#/components/schemas/TwoOneOfs'
        - $ref: '#/components/schemas/TwoRefs'
    Web:
      type: object
      properties: {host: {type: string}}
    Shell:
      type: object
      properties: {key: {type: string}}
    Server:
      oneOf:
        - $ref: '#/components/schemas/Web'
        - $ref: '#/components/schemas/Shell'
      discriminator:
        propertyName: server_type
        mapping:
          shell: '#/components/schemas/Shell'
          nginx: '#/components/schemas/Web'
          apache: '#/components/schemas/Web'
    SharedServerType:
      type: object
      properties: {server_type: {type: string}}
      anyOf:
        - $ref: '#/components/schemas/Web'
        - $ref: '#/components/schemas/Shell'
      discriminator:
        propertyName: server_type
        mapping:
          nginx: '#/components/schemas/Web'
          apache: '#/components/schemas/Web'
    Secure:
      type: object
      properties:
        is_secure: {type: boolean, enum: [true]}
        host: {type: string}
    Plain:
      type: object
      properties:
        is_secure: {enum: [false]}
        port: {type: integer}
    Connection:
      oneOf:
        - $ref: '#/components/schemas/Secure'
        - $ref: '#/components/schemas/Plain'
      discriminator:
        propertyName: is_secure
        mapping:
          "true": '#/components/schemas/Secure'
          "false": '#/components/schemas/Plain'
    IfLiteral:
      type: object
      properties: {secure: {type: boolean}}
      if: {required: [secure], properties: {secure: {const: true}}}
      then: {type: object, properties: {cert: {type: string}}}
      else: {type: object, properties: {port: {type: integer}}}
    IfObjectConst:
      if: {properties: {at: {const: {x: 1}}}}
      then: {type: object, properties: {a: {type: string}}}
      else: {type: object, properties: {b: {type: string}}}

name: Integration

# Started by hand for now; add a pull_request trigger to run it on every pull request.
on:
  workflow_dispatch:

permissions: read-all

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: list the CI specs
        id: specs
        run: |
          {
            echo 'paths<<EOF'
            grep -hv '^#' .github/ci-specs.txt .github/ci-router-specs.txt | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: fetch the CI specs
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SPECS_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: testdata/specs
          filter: blob:none
          sparse-checkout: ${{ steps.specs.outputs.paths }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: integration on the CI specs, batch ${{ matrix.batch }} of 4
        run: make test-integration-ci BATCH=${{ matrix.batch }}/4

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: lint with the golangci-lint version the Makefile pins
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: tidy
        run: make tidy-check

      - name: test with coverage gate
        run: make cover-check

      - name: runtime dependencies
        run: make runtime-deps

      # cover-check already compared the examples with a fresh run
      - name: examples
        run: make examples-build

  integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: list the CI specs
        id: specs
        run: |
          {
            echo 'paths<<EOF'
            grep -hv '^#' .github/ci-specs.txt .github/ci-router-specs.txt | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: fetch the CI specs
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SPECS_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: testdata/specs
          filter: blob:none
          sparse-checkout: ${{ steps.specs.outputs.paths }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: integration on the CI specs
        run: make test-integration-ci
